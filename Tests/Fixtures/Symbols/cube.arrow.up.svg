<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- An isometric cube, 30° axes, with an arrow rising out of its right face. -->
  <g id="wash">
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/>
  </g>
  <g id="outline" fill="none" stroke="black" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="50,6 88,28 88,72 50,94 12,72 12,28"/>
    <polyline points="12,28 50,50 88,28"/>
    <line x1="50" y1="50" x2="50" y2="94"/>
  </g>
  <g id="touch" fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
    <line x1="69" y1="78" x2="69" y2="50" data-knockout="true"/>
    <polyline points="60,59 69,50 78,59" data-knockout="true"/>
  </g>
</svg>
